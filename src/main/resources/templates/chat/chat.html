<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>실시간 채팅</title>

    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

    <style>

        html,
        body {
            height: 100%;
            margin: 0;
        }

        .container {
            margin-top: 30px;
        }

        .row {
            margin: 0 auto;
            width: 900px;
        }

        .user-panel {
            height: 650px;
            border: 1px solid #ddd;
            background: #fff;
            overflow-y: auto;
        }

        .chat-panel {
            height: 650px;
            border: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            padding: 0;
        }

        .chat-header {
            height: 55px;
            padding: 17px;
            background: #f7f7f7;
            border-bottom: 1px solid #ddd;
        }

        .chat-body {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #b2c7da;
        }

        .message-row {
            width: 100%;
            clear: both;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .bubble {
            max-width: 60%;
            padding: 10px 12px;
            border-radius: 10px;
            word-break: break-all;
            line-height: 1.4;
        }

        .bubble.left {
            float: left;
            background: #fff;
            border: 1px solid #eee;
        }

        .bubble.right {
            float: right;
            background: #ffeb33;
        }

        .sender {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 3px;
        }

        .chat-footer {
            padding: 10px;
            background: #eee;
            border-top: 1px solid #ddd;
        }

    </style>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script src="https://unpkg.com/vue@3.3.4/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vue-demi"></script> 
    <script src="https://unpkg.com/pinia@2.1.7/dist/pinia.iife.prod.js"></script>

    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>

    <script th:inline="javascript">
        const LOGIN_USER =
            /*[[${session.userid}]]*/ '';
    </script>

</head>

<body>

<div class="container"
     id="app">

    <div class="row">

        <div class="col-sm-3 user-panel">

            <h4 class="text-center">
                접속자
            </h4>

            <div class="list-group-item"
                 @click="store.changeRoom('public')"
                 style="cursor:pointer">

                <span class="glyphicon glyphicon-globe"></span>

                전체 채팅

            </div>

            <br>

            <div v-for="u in store.users"
                 :key="u"
                 class="list-group-item"
                 @click="store.changeRoom(u)"
                 style="cursor:pointer">

                <span class="glyphicon glyphicon-user"></span>

                {{ u }}

            </div>

        </div>

        <div class="col-sm-9 chat-panel">

            <div class="chat-header">

                <b>

                    <span v-if="store.currentRoom === 'public'">

                        전체 채팅

                    </span>

                    <span v-else>

                        1:1 채팅 -
                        {{ store.getOtherUser(store.currentRoom) }}

                    </span>

                </b>

            </div>

            <div class="chat-body"
                 ref="chatBody">

                <div class="message-row"
                     v-for="(m, index) in store.messages"
                     :key="index">

                    <div v-if="m.sender !== store.loginUser"
                         class="bubble left">

                        <div v-if="store.currentRoom !== 'public'"
                             class="sender">

                            {{ m.sender }}

                        </div>

                        {{ m.message }}

                    </div>

                    <div v-else
                         class="bubble right">

                        {{ m.message }}

                    </div>

                </div>

            </div>

            <div class="chat-footer">

                <div class="input-group">

                    <input type="text"
                           class="form-control"
                           v-model="store.msg"
                           @keyup.enter="store.send()"
                           placeholder="메시지 입력">

                    <span class="input-group-btn">

                        <button class="btn btn-warning"
                                @click="store.send()">

                            전송

                        </button>

                    </span>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="/vue/chat/chatStore.js"></script>

<script>
    // 피니아 라이브러리 생성
    const { createPinia } = Pinia

    // vue 라이브러리 생성 => 이게 바로 CDN 방식
    const {
        ref,
        createApp,
        onMounted
    } = Vue 

    const app = createApp({

    	// setup() => 한번에 모아서 소스코딩
        setup() {

    		// store 안에는 piniaStore와 관련된 모든게 저장돼 있음
            const store = useChatStore()

            // 스크롤바, 화면 (전체 => 1:1)
            const chatBody = ref(null)

            // onMounted => onload와 똑같아 => 화면이 생성이된 다음 실행해라
            onMounted(() => {

            	// 로그인한 사람의 아이디를 얻어오는 과정
                store.loginUser =
                    LOGIN_USER

                // 채팅창 UI와 관련
                store.chatBodyEl =
                    chatBody.value

                // 웹소캣과 연결되는 부분
                store.connect()

            })

            // return => html에서 사용이 가능하게하기 위해 해준다
            return {

                store,

                chatBody

            }

        }

    })

    // 피니아 등록하는 부분
    app.use(createPinia())

    // mount => 제어하는 html 영역 => 이 부분이 <template>에 해당된다
    app.mount('#app')

</script>

</body>

</html>
