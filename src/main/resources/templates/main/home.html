<!-- 이 파일은 화면이랑 store 들과 연결되는 파일이야 -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style type="text/css">
.row{
  width: 960px;
  margin: 0px auto;
}
p {
	overflow: hidden;
	white-space: nowrap;
	text-overflow: ellipsis;
}
</style>
</head>
<body>
  <div class="container">
   <div class="row">
    <div class="col-sm-3" v-for="(vo,index) in store.list" :key="index">
     <a :href="'http://localhost:9090/food/detail_before?no='+vo.no">
      <div class="thumbnail">
       <img :src="vo.poster" title="vo.address" style="width: 250px;height: 150px;object-fit:cover">
        <p>{{vo.name}}</p>
      </div>
     </a>
    </div>
   </div>
   <div class="row text-center" style="margin-top: 10px">
    <ul class="pagination">
     <li v-if="store.startPage>1"><a class="a-link" @click="store.move(store.startPage-1)">&laquo;</a></li>
     <li v-for="(i,index) in store.range" :class="i===store.curpage?'active':''"><a class="a-link" @click="store.move(i)">{{i}}</a></li>
     <li v-if="store.endPage<store.totalpage"><a class="a-link" @click="store.move(store.endPage+1)">&raquo;</a></li>
    </ul>
   </div>
  </div>
   <script src="/vue/axios.js"></script>
   <script src="/vue/food/foodStore.js"></script>
   <script>
    const {createApp,onMounted}=Vue
    const {createPinia}=Pinia
    const foodApp =createApp({
    	setup(){
    		 // store 가져오기
    		 const store=useFoodStore()
    		 // 시작과 동시에 값을 가져온다
    		 onMounted(()=>{
    			 // 시작하자 마자 한번 호출 하고 들어온다
    			 store.foodListData()
    		 })
    		 return {
    			 store
    		 }
    	}
    })
    foodApp.use(createPinia())
    foodApp.mount(".container")
   </script>
</body>
</html>
